<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VietGlow AI - Chỉnh Ảnh Đẹp</title>
    <!-- Google MediaPipe SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .app-container {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            background: #FAF2F2; border-radius: 32px; display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Top Header */
        .app-header {
            padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; background: #FAF2F2; z-index: 10;
        }
        .app-title { color: #EE7879; font-weight: 700; font-size: 19px; letter-spacing: -0.5px; }
        .pro-badge { background: #EE7879; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }

        /* Photo Display Frame */
        .preview-area {
            flex: 1; margin: 0 16px 12px; border-radius: 24px; overflow: hidden;
            position: relative; background: #EAEAEA; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        canvas { width: 100%; height: 100%; display: block; }
        video { display: none; }

        /* Mode Switcher Bar */
        .mode-switch {
            display: flex; justify-content: space-around; background: #fff;
            margin: 0 16px 12px; padding: 4px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(238,120,121,0.08);
        }
        .mode-btn {
            flex: 1; border: none; padding: 8px 0; border-radius: 16px; font-size: 12px;
            background: transparent; color: #888; cursor: pointer; font-weight: 600; transition: all 0.2s;
        }
        .mode-btn.active { background: #EE7879; color: #fff; }

        /* Control Panel */
        .controls-panel { padding: 8px 20px 20px; background: #FAF2F2; }
        .slider-group { margin-bottom: 12px; }
        .slider-label { font-size: 12px; color: #555; font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .slider-input {
            width: 100%; -webkit-appearance: none; height: 5px; border-radius: 3px; background: #F8D3D3; outline: none;
        }
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #EE7879; cursor: pointer;
            box-shadow: 0 2px 6px rgba(238,120,121,0.4);
        }

        /* Action Buttons */
        .action-bar { display: flex; gap: 10px; margin-top: 14px; }
        .btn-main {
            flex: 1; height: 48px; background: #EE7879; color: #fff; border: none;
            border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(238,120,121,0.3); transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-sub {
            width: 90px; height: 48px; background: #fff; color: #EE7879; border: 1.5px solid #EE7879;
            border-radius: 24px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="app-title">🪷 VietGlow AI</div>
        <div class="pro-badge">PRO</div>
    </div>

    <!-- Preview Area -->
    <div class="preview-area" id="preview-box">
        <canvas id="output_canvas"></canvas>
        <video id="input_video" playsinline></video>
    </div>

    <!-- Mode Selector -->
    <div class="mode-switch">
        <button class="mode-btn active" onclick="switchMode('beauty', this)">Làn da</button>
        <button class="mode-btn" onclick="switchMode('makeup', this)">Trang điểm</button>
        <button class="mode-btn" onclick="switchMode('aodai', this)">Áo Dài AI</button>
    </div>

    <!-- Control Sliders -->
    <div class="controls-panel">
        <div id="panel-beauty">
            <div class="slider-group">
                <div class="slider-label"><span>Làm trắng da</span><span id="v-whiten">50%</span></div>
                <input type="range" class="slider-input" id="whiten" min="0" max="100" value="50" oninput="draw()">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Mịn da tự nhiên</span><span id="v-smooth">40%</span></div>
                <input type="range" class="slider-input" id="smooth" min="0" max="100" value="40" oninput="draw()">
            </div>
        </div>

        <div id="panel-makeup" style="display:none;">
            <div class="slider-group">
                <div class="slider-label"><span>Son môi căng bóng</span><span id="v-lipstick">60%</span></div>
                <input type="range" class="slider-input" id="lipstick" min="0" max="100" value="60" oninput="draw()">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Má hồng má đào</span><span id="v-blush">30%</span></div>
                <input type="range" class="slider-input" id="blush" min="0" max="100" value="30" oninput="draw()">
            </div>
        </div>

        <div id="panel-aodai" style="display:none;">
            <p style="font-size:12px; color:#777; text-align:center; padding: 10px 0;">
                Tự động tạo chân dung Áo Dài truyền thống Việt Nam
            </p>
        </div>

        <div class="action-bar">
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="loadLocalImage(event)">
            <button class="btn-sub" onclick="document.getElementById('file-input').click()">Tải ảnh</button>
            <button class="btn-main" onclick="savePhoto()">Lưu hình ảnh</button>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let faceLandmarksData = null;
    let currentImage = null;

    // Load Default Portrait Image
    window.onload = () => {
        const defaultImg = new Image();
        defaultImg.crossOrigin = "anonymous";
        defaultImg.onload = () => {
            currentImage = defaultImg;
            draw();
        };
        defaultImg.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80";
    };

    // Calculate Aspect Ratio to Avoid Photo Stretching
    function draw() {
        if (!currentImage) return;

        const container = document.getElementById('preview-box');
        const cWidth = canvasElement.width = container.clientWidth;
        const cHeight = canvasElement.height = container.clientHeight;

        canvasCtx.clearRect(0, 0, cWidth, cHeight);

        const imgRatio = currentImage.width / currentImage.height;
        const canvasRatio = cWidth / cHeight;
        let renderW, renderH, offsetX, offsetY;

        if (imgRatio > canvasRatio) {
            renderH = cHeight;
            renderW = cHeight * imgRatio;
            offsetX = (cWidth - renderW) / 2;
            offsetY = 0;
        } else {
            renderW = cWidth;
            renderH = cWidth / imgRatio;
            offsetX = 0;
            offsetY = (cHeight - renderH) / 2;
        }

        const whiten = document.getElementById('whiten').value / 100;
        const lipstick = document.getElementById('lipstick').value / 100;
        const blush = document.getElementById('blush').value / 100;

        canvasCtx.filter = `brightness(${100 + whiten * 20}%) contrast(${100 + whiten * 8}%) saturate(${100 + lipstick * 15}%)`;
        canvasCtx.drawImage(currentImage, offsetX, offsetY, renderW, renderH);
        canvasCtx.filter = 'none';

        document.getElementById('v-whiten').innerText = document.getElementById('whiten').value + '%';
        document.getElementById('v-smooth').innerText = document.getElementById('smooth').value + '%';
        document.getElementById('v-lipstick').innerText = document.getElementById('lipstick').value + '%';
        document.getElementById('v-blush').innerText = document.getElementById('blush').value + '%';
    }

    function switchMode(mode, btn) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.getElementById('panel-beauty').style.display = mode === 'beauty' ? 'block' : 'none';
        document.getElementById('panel-makeup').style.display = mode === 'makeup' ? 'block' : 'none';
        document.getElementById('panel-aodai').style.display = mode === 'aodai' ? 'block' : 'none';
    }

    function loadLocalImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                draw();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    function savePhoto() {
        const link = document.createElement('a');
        link.download = 'vietglow_edited.png';
        link.href = canvasElement.toDataURL();
        link.click();
    }
</script>
</body>
</html>
